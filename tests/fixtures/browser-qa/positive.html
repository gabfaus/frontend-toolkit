<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Part lookup</title>
    <style>
      :focus-visible { outline: 3px solid #155eef; outline-offset: 3px; }
      .motion { transition: transform 120ms ease; }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; scroll-behavior: auto !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="#main">Skip to content</a>
      <nav aria-label="Primary navigation">
        <a href="#main">Lookup</a>
        <a href="#help">Help</a>
      </nav>
    </header>
    <main id="main">
      <h1>Honda part lookup</h1>
      <h2>Search by part number</h2>
      <form aria-describedby="search-help">
        <label for="part-number">Part number</label>
        <input id="part-number" name="part-number" autocomplete="off">
        <button class="motion" type="submit">Search</button>
        <p id="search-help">Enter a genuine Honda part number.</p>
      </form>
    </main>
    <footer id="help">Help is available from the operations team.</footer>
  </body>
</html>
